name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guestd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guest/firn-guestd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/firn-guestd/go.mod
          cache-dependency-path: guest/firn-guestd/go.sum
      - run: go test -race -count=1 -v ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o /tmp/firn-guestd .

  hostnet-and-swift-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/firn-hostnet/go.mod
          cache-dependency-path: host/firn-hostnet/go.sum
      - name: Check installer & Homebrew formula syntax
        run: |
          bash -n scripts/install.sh
          ruby -c packaging/homebrew/firn.rb
      - name: Test hostnet
        working-directory: host/firn-hostnet
        run: |
          go test -race -count=1 -v ./...
          go vet ./...
      - name: Build hostnet & Swift products
        run: |
          make hostnet
          make swift
      - name: Run FirnCore unit checks
        run: swift run FirnCoreCheck
      - name: Verify firnd entitlements
        run: codesign -d --entitlements :- build/firnd
